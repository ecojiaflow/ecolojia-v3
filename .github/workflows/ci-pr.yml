name: ci-pr
on:
  pull_request:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Backend install & build
        working-directory: backend
        run: |
          npm ci
          npm run -s build || echo "no build step"
      - name: Frontend install & typecheck+build
        working-directory: frontend
        run: |
          npm ci
          npm run -s lint
          npm run -s build
